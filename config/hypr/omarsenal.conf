# Omarsenal keybinds. Sourced from ~/.config/hypr/hyprland.conf by install.sh.
# SUPER+ALT keeps clear of Omarchy's default bindings. Check SUPER+K for conflicts.

bindd = SUPER ALT, R, Omarsenal red mode, exec, ~/.local/bin/omarsenal-mode red
bindd = SUPER ALT, B, Omarsenal blue mode, exec, ~/.local/bin/omarsenal-mode blue
bindd = SUPER ALT, P, Omarsenal purple mode, exec, ~/.local/bin/omarsenal-mode purple
bindd = SUPER ALT, O, Omarsenal ops off, exec, ~/.local/bin/omarsenal-mode off
bindd = SUPER ALT, W, Omarsenal ops workspace, exec, ~/.local/bin/omarsenal-workspace
