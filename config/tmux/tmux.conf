# Omarsenal tmux config. Use with: tmux -f ~/.config/omarsenal/tmux.conf
# Or add `source-file ~/.config/omarsenal/tmux.conf` to your own ~/.tmux.conf.

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"

# Split in the current directory (handy inside a target folder)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Status bar shows the Omarsenal mode and target
set -g status-interval 10
set -g status-style "bg=#0a0606,fg=#c1121f"
set -g status-right "#(cat ~/.local/state/omarsenal/mode 2>/dev/null) #(cat ~/.local/state/omarsenal/target 2>/dev/null) | %H:%M "
